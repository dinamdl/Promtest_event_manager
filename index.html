<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prom-Test միջոցառումներ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="mode" id="mode">Բեռնվում է…</div>
      <h1>Prom-Test միջոցառումներ</h1>
      <p class="sub">Հովանավորվող կոնֆերանսներ, պատասխանատուներ և տպագրական նյութեր</p>
    </div>
    <div class="actions">
      <button id="importBtn" type="button">Ներմուծել CSV</button>
      <button id="exportBtn" type="button">Արտահանել CSV</button>
      <button id="addBtn" class="primary" type="button">+ Նոր միջոցառում</button>
      <input id="fileIn" type="file" accept=".csv,text/csv" hidden>
    </div>
  </header>

  <section class="summary" id="summary" aria-label="Ամփոփում"></section>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Որոնել՝ անվանում, վայր, լսարան…" aria-label="Որոնում">
    <div class="seg" role="group" aria-label="Կարգավիճակ">
      <button type="button" data-f="upcoming" aria-pressed="true">Առաջիկա</button>
      <button type="button" data-f="past" aria-pressed="false">Անցած</button>
      <button type="button" data-f="all" aria-pressed="false">Բոլորը</button>
    </div>
    <select id="person" aria-label="Պատասխանատու"><option value="">Բոլոր պատասխանատուները</option></select>
  </div>

  <main id="list"></main>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="panel" id="form" novalidate>
    <div class="row"><h3 id="formTitle">Նոր միջոցառում</h3><button type="button" id="closeBtn" aria-label="Փակել">✕</button></div>
    <label>Միջոցառման անվանում *<input id="f_name" required></label>
    <div class="grid2">
      <label>Սկիզբ *<input id="f_start" type="date" required></label>
      <label>Ավարտ (եթե մի քանի օր է)<input id="f_end" type="date"></label>
      <label>Ժամ<input id="f_time" placeholder="օր.՝ 10:00"></label>
      <label>Գրանցման ամսաթիվ<input id="f_reg" type="date"></label>
      <label>Կազմակերպություն<input id="f_org" list="dl_org"></label>
      <label>Ներկայացման ձևաչափ<input id="f_format" list="dl_format" placeholder="Հովանավոր"></label>
      <label>Վայր<input id="f_location" list="dl_location"></label>
      <label>Պատասխանատու<input id="f_resp" list="dl_resp"></label>
    </div>
    <label>Թիրախային լսարան<textarea id="f_aud" rows="2"></textarea></label>
    <label>Տպագրական նյութեր<input id="f_mat" list="dl_mat" placeholder="Roll-up, բուկլետ…"></label>
    <label>Նշումներ<textarea id="f_notes" rows="3"></textarea></label>
    <datalist id="dl_org"></datalist><datalist id="dl_format"></datalist><datalist id="dl_location"></datalist><datalist id="dl_resp"></datalist><datalist id="dl_mat"></datalist>
    <div id="confirmBox" class="confirm" hidden>Ջնջե՞լ այս միջոցառումը։ <button type="button" id="yesDel" class="danger">Այո, ջնջել</button><button type="button" id="noDel">Չեղարկել</button></div>
    <div class="row">
      <button type="button" id="delBtn" class="danger" hidden>Ջնջել</button>
      <span></span>
      <div class="actions"><button type="button" id="cancelBtn">Չեղարկել</button><button type="submit" id="saveBtn" class="primary">Պահպանել</button></div>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
