<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Պրոմ-Տեստ Լաբորատորիաներ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="start">
  <div class="start-card">
    <div class="logo-box"><img src="logo.png" alt="Prom-Test Laboratories" width="790" height="265"></div>
    <div class="lab">Պրոմ-Տեստ Լաբորատորիաներ</div>
    <div class="rule"></div>
    <div class="mode">Տվյալները պահվում են այս բրաուզերում</div>
    <h1>Միջոցառումներ</h1>
    <p class="sub">Հովանավորվող կոնֆերանսներ, պատասխանատուներ և տպագրական նյութեր</p>
    <div class="start-stats" id="stats" hidden></div>
    <a class="btn primary enter" href="events.html">Բացել միջոցառումները →</a>
  </div>
</main>
<script src="data.js"></script>
<script>
(function(){
  var ev=[]; try{ev=JSON.parse(localStorage.getItem("promtest-events-v1")||"[]")}catch(e){}
  if(!ev.length&&window.SEED_EVENTS)ev=window.SEED_EVENTS;
  if(!ev.length)return;
  var t=new Date(); t.setHours(0,0,0,0);
  var day=function(s){var p=String(s||"").split("-");return p.length===3?new Date(+p[0],p[1]-1,+p[2]):null};
  var up=ev.filter(function(e){var x=day(e.end)||day(e.start);return x&&x>=t}).sort(function(a,b){return (a.start||"").localeCompare(b.start||"")});
  var box=document.getElementById("stats");
  box.innerHTML='<div><b>'+ev.length+'</b>Ընդհանուր</div><div><b>'+up.length+'</b>Առաջիկա</div>';
  if(up[0]){var s=document.createElement("div");var b=document.createElement("b");b.textContent=up[0].name;b.style.fontSize="15px";s.appendChild(b);s.appendChild(document.createTextNode("Հաջորդը"));box.appendChild(s);}
  box.hidden=false;
})();
</script>
</body>
</html>
